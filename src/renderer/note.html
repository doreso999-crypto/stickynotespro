<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'"
    />
    <title>StickyNotesPro</title>
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/note.css" />
  </head>

  <body class="note-page">
    <main id="note-app" class="note-shell" data-pinned="true" data-save-state="saved">
      <header class="note-toolbar">
        <button id="new-note" class="toolbar-button" type="button" title="Create a new note">
          <span aria-hidden="true">+</span>
          <span>New</span>
        </button>

        <div class="toolbar-spacer" aria-hidden="true"></div>

        <button
          id="pin-note"
          class="toolbar-button pin-button"
          type="button"
          aria-pressed="true"
          title="Toggle always on top"
        >
          <span class="pin-state pin-state-pinned">Pinned</span>
          <span class="pin-state pin-state-unpinned">Pin</span>
        </button>

        <details class="note-menu">
          <summary class="toolbar-button">More</summary>
          <div class="note-menu-panel">
            <button data-action="duplicate" type="button">Duplicate note</button>
            <button data-action="hide" type="button">Hide note</button>
            <button data-action="archive" type="button">Archive note</button>
            <button data-action="delete" class="danger-action" type="button">Delete permanently</button>
          </div>
        </details>
      </header>

      <section class="note-editor" aria-label="Note editor">
        <label class="sr-only" for="title">Note title</label>
        <input
          id="title"
          class="note-title"
          type="text"
          maxlength="200"
          autocomplete="off"
          placeholder="Untitled note"
        />

        <label class="sr-only" for="body">Note content</label>
        <textarea
          id="body"
          class="note-body"
          maxlength="1000000"
          spellcheck="true"
          placeholder="Write something…"
        ></textarea>
      </section>

      <footer class="note-footer">
        <div class="save-status" role="status" aria-live="polite">
          <span class="save-label save-label-saved">Saved</span>
          <span class="save-label save-label-saving">Saving…</span>
          <span class="save-label save-label-error">Save failed</span>
        </div>

        <button id="dashboard" class="dashboard-button" type="button">Dashboard</button>
      </footer>
    </main>

    <div id="error" class="error-banner" role="alert" hidden></div>

    <script type="module" src="scripts/note.js"></script>
  </body>
</html>
